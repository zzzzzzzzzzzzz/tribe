# Local development only. Production uses deploy/compose.prod.yml.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - local-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine

  qdrant:
    image: qdrant/qdrant:v1.11.5
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY:?Set Qdrant key}
    volumes:
      - local-qdrant:/qdrant/storage

  backend:
    image: tribe-backend:local
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      FASTEMBED_CACHE_PATH: /app/cache
      MAX_WORKERS: "1"
      WEB_CONCURRENCY: "1"
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - local-cache:/app/cache
      - local-uploads:/app/upload-data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  celery:
    image: tribe-backend:local
    env_file: .env
    environment:
      POSTGRES_SERVER: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      FASTEMBED_CACHE_PATH: /app/cache
    command: >-
      poetry run celery -A app.core.celery_app.celery_app worker
      --loglevel=info --uid=celery --gid=celery
      --concurrency=${CELERY_CONCURRENCY:-1}
      --max-memory-per-child=${MAX_MEMORY_PER_CHILD:-512000}
    volumes:
      - local-cache:/app/cache
      - local-uploads:/app/upload-data
    depends_on: [backend, redis]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [backend]

volumes:
  local-db:
  local-qdrant:
  local-cache:
  local-uploads:
