name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6

      - name: Create local test environment
        run: cp .env.example .env

      - name: Build backend and frontend
        run: docker compose -f docker-compose.yml build backend frontend

      - name: Start backing services and backend
        run: docker compose -f docker-compose.yml up -d db redis qdrant backend

      - name: Check backend container and startup
        run: |
          set -euo pipefail
          sleep 15
          docker compose -f docker-compose.yml ps
          test "$(docker inspect -f '{{.State.Running}}' "$(docker compose -f docker-compose.yml ps -q backend)")" = true

      - name: Lint
        run: docker compose -f docker-compose.yml exec -T backend bash /app/lint.sh

      - name: Run tests
        run: docker compose -f docker-compose.yml exec -T backend bash /app/tests-start.sh

      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color --tail=100

      - name: Stop test containers
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans
