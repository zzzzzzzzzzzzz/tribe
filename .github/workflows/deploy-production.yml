name: Deploy Tribe

on:
  workflow_dispatch:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: tribe-production
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/master'
      ) || (
        vars.TRIBE_AUTO_DEPLOY == 'true' &&
        (
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          (github.event_name == 'release' && github.event.action == 'published')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/zzzzzzzzzzzzz/tribe-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/zzzzzzzzzzzzz/tribe

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=https://tribe.zzzzzzzzzzzzz.cc
          tags: ghcr.io/zzzzzzzzzzzzz/tribe-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/zzzzzzzzzzzzz/tribe

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure verified SSH access
        env:
          PRIVATE_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy production manifests
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/compose.prod.yml deploy/compose.proxy.yml deploy/remote-deploy.sh \
            tribe-deploy@95.56.251.147:/opt/tribe/

      - name: Pull images and deploy (no server-side build)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            tribe-deploy@95.56.251.147 \
            "GHCR_USER='$GHCR_USER' TAG='$IMAGE_TAG' bash /opt/tribe/remote-deploy.sh"
